name: grease-receipt

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpp-spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REPO_ROOT: ${{ github.workspace }}/source-worktree
    steps:
      - name: Check out exact Grease head and pinned Oils source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Verify and record the source pin
        id: source_pin
        shell: bash
        run: |
          revision=$(git rev-parse HEAD:source)
          test "$(git -C source rev-parse HEAD)" = "$revision"
          . /etc/os-release
          test "$ID" = ubuntu
          test "$(uname -m)" = x86_64
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Grease: $(git rev-parse HEAD)"
          echo "Oils source: $revision"
          echo "Ubuntu: $PRETTY_NAME"

      - name: Check out pinned Oils source as standalone worktree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/oils
          ref: ${{ steps.source_pin.outputs.revision }}
          path: source-worktree
          persist-credentials: false

      - name: Verify standalone source revision
        shell: bash
        run: test "$(git -C source-worktree rev-parse HEAD)" = "${{ steps.source_pin.outputs.revision }}"

      - name: Fix kernel mmap rnd bits
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Run and verify inherited Oils cpp-spec oracle
        working-directory: source-worktree
        shell: bash
        run: |
          podman --version
          soil/github-actions.sh run-job cpp-spec podman
          test "$(cat _tmp/soil/commit-hash.txt)" = "${{ steps.source_pin.outputs.revision }}"
          soil/host-shim.sh did-all-succeed cpp-spec

      - name: Exercise Vast.ai REST requests from Grease
        working-directory: source-worktree
        shell: bash
        run: |
          test -x _bin/cxx-asan/ysh

          port_file="$RUNNER_TEMP/vast-fixture-port"
          python3 "$GITHUB_WORKSPACE/tests/vast_fixture_server.py" \
            --port-file "$port_file" &
          server_pid=$!

          for attempt in $(seq 1 100); do
            if test -s "$port_file"; then
              break
            fi
            sleep 0.1
          done
          test -s "$port_file"

          export VAST_API_BASE_URL="http://127.0.0.1:$(cat "$port_file")"
          export VAST_API_KEY='fixture-token'
          vast="$GITHUB_WORKSPACE/commands/vast/vast.ysh"

          _bin/cxx-asan/ysh "$vast" user > /dev/null
          _bin/cxx-asan/ysh "$vast" offers '{"limit":1}' > /dev/null
          _bin/cxx-asan/ysh "$vast" create 42 \
            '{"image":"example/test:1","disk":20}' > /dev/null
          _bin/cxx-asan/ysh "$vast" instance 77 > /dev/null
          _bin/cxx-asan/ysh "$vast" instances > /dev/null
          _bin/cxx-asan/ysh "$vast" start 77 > /dev/null
          _bin/cxx-asan/ysh "$vast" stop 77 > /dev/null
          _bin/cxx-asan/ysh "$vast" destroy 77 > /dev/null

          wait "$server_pid"

          missing_key_log="$RUNNER_TEMP/vast-missing-key.txt"
          if env -u VAST_API_KEY \
              _bin/cxx-asan/ysh "$vast" user \
              > "$missing_key_log" 2>&1; then
            echo 'Grease Vast client accepted a missing API key' >&2
            exit 1
          fi
          grep -Fqx 'VAST_API_KEY is required' "$missing_key_log"

      - name: Install host dependency for focused native test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreadline-dev

      - name: Build and run focused libc native tests
        working-directory: source-worktree
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" _build _bin
          ninja _bin/cxx-dbg/cpp/libc_test
          _bin/cxx-dbg/cpp/libc_test -t grease_native_

      - name: Exercise keep-size fallocate from Grease
        working-directory: source-worktree
        shell: bash
        run: |
          test -x _bin/cxx-asan/ysh
          reserve_file=$(mktemp)
          trap 'rm -f "$reserve_file"' EXIT
          before_size=$(stat -c '%s' "$reserve_file")
          before_blocks=$(stat -c '%b' "$reserve_file")
          test "$before_size" = 0
          _bin/cxx-asan/ysh \
            "$GITHUB_WORKSPACE/examples/fallocate-keep-size.ysh" "$reserve_file"
          after_size=$(stat -c '%s' "$reserve_file")
          after_blocks=$(stat -c '%b' "$reserve_file")
          test "$after_size" = "$before_size"
          test "$after_blocks" -gt "$before_blocks"

      - name: Exercise mapped IB index from Grease
        working-directory: source-worktree
        shell: bash
        run: |
          test -x _bin/cxx-asan/ysh
          index_file=$(mktemp)
          trap 'rm -f "$index_file"' EXIT
          truncate -s 4096 "$index_file"
          printf fragment | dd of="$index_file" conv=notrunc status=none
          _bin/cxx-asan/ysh \
            "$GITHUB_WORKSPACE/examples/ib-mapped-index.ysh" "$index_file"
          test "$(head -c 8 "$index_file")" = pensieve

      - name: Check out exact accelerometer producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Ashtray-Archer/utilities-android-phone-user
          ref: c8e148889645113040f243d5d3c6801274eae3f1
          path: accelerometer-producer
          persist-credentials: false

      - name: Pipe exact accelerometer inspection through Grease
        working-directory: source-worktree
        shell: bash
        run: |
          set -eu
          producer="$GITHUB_WORKSPACE/accelerometer-producer"
          fixture="$RUNNER_TEMP/accelerometer-inspection-fixture"
          receipt="$RUNNER_TEMP/grease-accelerometer-receipt.txt"

          cc -std=c17 -O2 -Wall -Wextra -Werror -Wpedantic -Wshadow \
            -I"$producer/accelerometer/model" \
            -I"$producer/accelerometer/command" \
            "$producer/accelerometer/tests/inspection_fixture.c" \
            -lm \
            -o "$fixture"

          test -x _bin/cxx-asan/ysh
          "$fixture" |
            _bin/cxx-asan/ysh \
              "$GITHUB_WORKSPACE/examples/accelerometer-inspection.ysh" |
            tee "$receipt"

          grep -Fqx 'android.x_m_per_s2=1.25' "$receipt"
          grep -Fqx 'compact.encode_status=ok' "$receipt"
          grep -Fqx 'PASS Grease consumed accelerometer inspection' "$receipt"

          good="$RUNNER_TEMP/accelerometer-inspection-good.tsv"
          bad="$RUNNER_TEMP/accelerometer-inspection-missing-status.tsv"
          "$fixture" > "$good"
          grep -v '^compact[.]encode_status	' "$good" > "$bad"
          if _bin/cxx-asan/ysh \
              "$GITHUB_WORKSPACE/examples/accelerometer-inspection.ysh" < "$bad"; then
            echo 'Grease accepted an inspection record with compact.encode_status missing' >&2
            exit 1
          fi
