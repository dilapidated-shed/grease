name: ish acceptance

on:
  push:
    branches:
      - ish
  pull_request:
    branches:
      - ish

permissions:
  contents: read

jobs:
  one-incantation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Read exact Idriç pin
        id: idric
        shell: sh
        run: |
          revision=$(sed -n 's/^revision = "\([0-9a-f][0-9a-f]*\)"$/\1/p' _/idric.lock)
          test -n "$revision"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: isomorphisms/Idric
          ref: ${{ steps.idric.outputs.revision }}
          path: _idric

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl strace

      - name: Bootstrap exact Idriç revision
        run: ./_idric/_/edric bootstrap

      - name: Build from clean state and run executable acceptance
        env:
          IDRIS2_PREFIX: ${{ github.workspace }}/_idric/_/bootstrap-build
          IDRIC: ${{ github.workspace }}/_idric/_/build/exec/idris2
          CHEZ: ${{ github.workspace }}/_idric/_/.tools/bin/scheme
        run: make -C _ acceptance

      - name: Verify repository cleanliness
        run: |
          rm -rf _idric
          test -z "$(git status --porcelain --untracked-files=all)"
