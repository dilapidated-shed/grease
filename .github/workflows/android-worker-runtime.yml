name: Grease Android worker runtime
on:
  pull_request:
    paths:
      - 'android/**'
      - 'examples/autogenerated/android-worker-runtime/**'
      - '.github/workflows/android-worker-runtime.yml'
      - 'source'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-worker:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      REPO_ROOT: ${{ github.workspace }}/source-worktree
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: true
          persist-credentials: false
      - name: Read the authoritative implementation gitlink
        id: source_pin
        shell: sh
        run: make -f android/Makefile source-pin >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/oils
          ref: ${{ steps.source_pin.outputs.revision }}
          path: source-worktree
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 12ed58b2bb5ddf599ae898ebb0b8a950141b2718
          path: .tools/independent
          persist-credentials: false
      - name: Declare the host observation dependency
        shell: sh
        run: make -f android/Makefile dependencies
      - name: Preserve the inherited ASAN generator's kernel requirement
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Generate the exact maintained C++ source through the existing owner
        working-directory: source-worktree
        run: soil/github-actions.sh run-job cpp-tarball podman
      - name: Verify generation and expose its current native host orchestrator
        shell: sh
        run: make -f android/Makefile bootstrap SOURCE="$GITHUB_WORKSPACE/source-worktree" HOST_OUTPUT="$RUNNER_TEMP/grease-host"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'ndk;27.2.12479018'
      - name: Build generic x86_64 ARM32 and ARM64 worker engines
        shell: sh
        run: '"$IB_GREASE" examples/autogenerated/android-worker-runtime/prepare.grease "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/source-worktree" "$ANDROID_HOME/ndk/27.2.12479018" "$RUNNER_TEMP/grease-native"'
      - name: Prepare emulator KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Independently execute the native worker engine on API 29
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          AICI_EXPECTED_ANDROID_API: '29'
        with:
          api-level: 29
          target: default
          arch: x86_64
          avd-name: grease-worker-api29
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          script: '"$IB_GREASE" .tools/independent/grease/android-worker/observe.grease "$GITHUB_WORKSPACE/.tools/independent" "$RUNNER_TEMP/grease-native/x86_64" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "${{ steps.source_pin.outputs.revision }}" "$RUNNER_TEMP/grease-native-api29"'
      - name: Independently execute the native worker engine on API 34
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          AICI_EXPECTED_ANDROID_API: '34'
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: grease-worker-api34
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 2048 -gpu swiftshader_indirect
          script: '"$IB_GREASE" .tools/independent/grease/android-worker/observe.grease "$GITHUB_WORKSPACE/.tools/independent" "$RUNNER_TEMP/grease-native/x86_64" "$ANDROID_HOME/platform-tools/adb" emulator-5554 "${{ steps.source_pin.outputs.revision }}" "$RUNNER_TEMP/grease-native-api34"'
      - name: Retain source and target evidence without release promotion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grease-Android-worker-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            source-worktree/_release/oils-for-unix.tar
            source-worktree/_tmp/soil/commit-hash.txt
            ${{ runner.temp }}/grease-native/generated-source.sha256
            ${{ runner.temp }}/grease-native/packaging-commit.txt
            ${{ runner.temp }}/grease-native/source-commit.txt
            ${{ runner.temp }}/grease-native/x86_64/libib_grease.so
            ${{ runner.temp }}/grease-native/x86_64/receipts
            ${{ runner.temp }}/grease-native/armeabi-v7a/libib_grease.so
            ${{ runner.temp }}/grease-native/armeabi-v7a/receipts
            ${{ runner.temp }}/grease-native/arm64-v8a/libib_grease.so
            ${{ runner.temp }}/grease-native/arm64-v8a/receipts
            ${{ runner.temp }}/grease-native-api29
            ${{ runner.temp }}/grease-native-api34
          if-no-files-found: error
