name: grease-phone-armv7-runtime

on:
  push:
    branches: ['phone/armv7-runtime']
  pull_request:
    paths:
      - 'phone/**'
      - '.github/workflows/phone-armv7-runtime.yml'
      - 'source'

permissions:
  contents: write

jobs:
  build-armv7-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_API: '28'
      ANDROID_ABI: armeabi-v7a
      ANDROID_NDK_VERSION: '27.3.13750724'
      REPO_ROOT: ${{ github.workspace }}/source-worktree
    steps:
      - name: Check out exact Grease head and pinned Oils source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Verify exact source pin and Ubuntu host
        id: source_pin
        shell: bash
        run: |
          revision=$(git rev-parse HEAD:source)
          test "$(git -C source rev-parse HEAD)" = "$revision"
          . /etc/os-release
          test "$ID" = ubuntu
          test "$(uname -m)" = x86_64
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Grease: $(git rev-parse HEAD)"
          echo "Oils source: $revision"
          echo "Ubuntu: $PRETTY_NAME"

      - name: Check out pinned Oils source as standalone worktree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dilapidated-shed/oils
          ref: ${{ steps.source_pin.outputs.revision }}
          path: source-worktree
          persist-credentials: false

      - name: Verify standalone source revision
        shell: bash
        run: test "$(git -C source-worktree rev-parse HEAD)" = "${{ steps.source_pin.outputs.revision }}"

      - name: Fix kernel mmap rnd bits
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Generate native C++ source bundle with inherited Oils cpp-tarball job
        working-directory: source-worktree
        shell: bash
        run: |
          podman --version
          soil/github-actions.sh run-job cpp-tarball podman
          test "$(cat _tmp/soil/commit-hash.txt)" = "${{ steps.source_pin.outputs.revision }}"
          soil/host-shim.sh did-all-succeed cpp-tarball
          test -f _release/oils-for-unix.tar

      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''

      - name: Install pinned Android NDK
        shell: bash
        run: sdkmanager "ndk;$ANDROID_NDK_VERSION"

      - name: Extract generated native source bundle
        id: native_source
        shell: bash
        run: |
          rm -rf build/native-source build/package
          mkdir -p build/native-source build/package
          tar -xf source-worktree/_release/oils-for-unix.tar -C build/native-source
          source_dir=$(find build/native-source -mindepth 1 -maxdepth 1 -type d -name 'oils-for-unix-*' -print -quit)
          test -n "$source_dir"
          test -x "$source_dir/_build/oils.sh"
          echo "dir=$source_dir" >> "$GITHUB_OUTPUT"

      - name: Cross-build ARMv7 Android runtime
        shell: bash
        env:
          GREASE_SOURCE_SHA: ${{ steps.source_pin.outputs.revision }}
          GREASE_PACKAGING_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test -d "$ANDROID_NDK_HOME"
          bash phone/build-armv7-runtime.sh \
            "${{ steps.native_source.outputs.dir }}" \
            build/package

      - name: Verify pinned NDK receipt
        shell: bash
        run: |
          awk -F '\t' -v expected="$ANDROID_NDK_VERSION" \
            '$1 == "ndk_revision" { found = 1; if ($2 != expected) exit 1 } END { if (!found) exit 1 }' \
            build/package/receipts/build.tsv

      - name: Package deterministic phone artifact
        id: package
        shell: bash
        run: |
          test -x build/package/bin/grease
          test -x build/package/bin/ysh
          tar \
            --sort=name \
            --mtime='UTC 2020-01-01' \
            --owner=0 --group=0 --numeric-owner \
            -C build/package -czf build/grease-armv7-termux.tar.gz .
          sha256=$(sha256sum build/grease-armv7-termux.tar.gz | awk '{print $1}')
          printf '%s  grease-armv7-termux.tar.gz\n' "$sha256" > build/grease-armv7-termux.tar.gz.sha256
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "artifact SHA-256 $sha256"

      - name: Upload exact build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grease-armv7-termux-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/grease-armv7-termux.tar.gz
            build/grease-armv7-termux.tar.gz.sha256
            build/package/receipts/
          if-no-files-found: error

      - name: Publish immutable phone prerelease
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source_pin.outputs.revision }}
          ARTIFACT_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          short=${GITHUB_SHA:0:12}
          tag="phone-armv7-$short"
          cat > build/release-notes.txt <<EOF
          ARMv7 Android/Termux Grease runtime.

          Grease repository commit: $GITHUB_SHA
          Pinned Oils-derived Grease source: $SOURCE_SHA
          ABI: armeabi-v7a
          Android API floor: $ANDROID_API
          Android NDK: $ANDROID_NDK_VERSION
          Artifact SHA-256: $ARTIFACT_SHA256

          GitHub-hosted Ubuntu build evidence only. Physical-phone execution remains pending until Phone Cat Food installs and exercises this exact artifact.
          EOF
          gh release create "$tag" \
            build/grease-armv7-termux.tar.gz \
            build/grease-armv7-termux.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Grease phone ARMv7 $short" \
            --notes-file build/release-notes.txt
