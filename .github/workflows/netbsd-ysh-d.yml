name: NetBSD YSH D translation

on:
  push:
    branches:
      - netbsd/greased
  pull_request:
    paths:
      - '.github/workflows/netbsd-ysh-d.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netbsd-ysh-d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  netbsd-9_3-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NETBSD_RELEASE: "9.3"
      NETBSD_TARGET: x86_64-unknown-netbsd
      ICK_REVISION: 5684ab4d2ff655a36f6bf88a391260ea288ac855
      GREASE_D_REVISION: d5ef8cad8a41600c8ab2699cd0572d45e79397e6
      GREASE_D_BASE: c589aa679b6625eb9a124f5af637a7be454a27b0
    steps:
      - name: Check out exact Grease head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check out exact D translation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: dilapidated-shed/oils
          ref: ${{ env.GREASE_D_REVISION }}
          path: d-source
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact Icky GDC source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: dilapidated-shed/ick
          ref: ${{ env.ICK_REVISION }}
          path: .ick
          persist-credentials: false
          submodules: true

      - name: Verify translation provenance
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C d-source rev-parse HEAD)" = "$GREASE_D_REVISION"
          test "$(git -C .ick rev-parse HEAD)" = "$ICK_REVISION"

          merge_base=$(git -C d-source merge-base "$GREASE_D_REVISION" "$GREASE_D_BASE")
          test "$merge_base" = "$GREASE_D_BASE"
          test "$(git -C d-source rev-list --count "$GREASE_D_BASE".."$GREASE_D_REVISION")" -gt 0
          test -f d-source/ysh/d/source/app.d
          test -f d-source/ysh/d/PORTING.md

      - name: Install compiler build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gdc flex bison texinfo curl xz-utils \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev

      - name: Materialize Icky GDC source
        shell: bash
        run: |
          set -euxo pipefail
          sh .ick/ick/materialize.sh \
            "$GITHUB_WORKSPACE/.ick/gcc" \
            "$GITHUB_WORKSPACE/_ick-source"
          test -d _ick-source/libphobos/libdruntime
          test -d _ick-source/libphobos/src

      - name: Materialize verified NetBSD sysroot
        shell: bash
        run: |
          set -euxo pipefail
          sets="https://cdn.netbsd.org/pub/NetBSD/NetBSD-${NETBSD_RELEASE}/amd64/binary/sets"
          mkdir -p _netbsd-sets _netbsd-sysroot _receipt
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$sets/SHA512" -o _netbsd-sets/SHA512

          : > _receipt/netbsd-sets.txt
          for archive in base.tar.xz comp.tar.xz; do
            curl --fail --location --proto '=https' --tlsv1.2 \
              "$sets/$archive" -o "_netbsd-sets/$archive"
            expected=$(awk -v name="($archive)" '$2 == name { print $4 }' _netbsd-sets/SHA512)
            test -n "$expected"
            actual=$(sha512sum "_netbsd-sets/$archive" | awk '{ print $1 }')
            test "$actual" = "$expected"
            printf '%s  %s\n' "$actual" "$archive" >> _receipt/netbsd-sets.txt
            tar -xJpf "_netbsd-sets/$archive" -C _netbsd-sysroot
          done

          test -f _netbsd-sysroot/usr/include/sys/types.h
          test -f _netbsd-sysroot/usr/lib/crt0.o
          test -f _netbsd-sysroot/usr/lib/libc.so

      - name: Provide x86-64 GNU target tools
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p _netbsd-tools
          for tool in as ld ar nm ranlib strip objcopy objdump readelf; do
            host_tool=$(command -v "$tool")
            test -n "$host_tool"
            ln -s "$host_tool" "_netbsd-tools/${NETBSD_TARGET}-$tool"
          done
          printf '%s\n' "$GITHUB_WORKSPACE/_netbsd-tools" >> "$GITHUB_PATH"

      - name: Build Icky GDC runtime stack for NetBSD
        shell: bash
        run: |
          set -euxo pipefail
          mkdir _ick-build _ick-stage
          cd _ick-build
          ../_ick-source/configure \
            --target="$NETBSD_TARGET" \
            --prefix="$GITHUB_WORKSPACE/_ick-stage" \
            --with-sysroot="$GITHUB_WORKSPACE/_netbsd-sysroot" \
            --with-native-system-header-dir=/usr/include \
            --enable-languages=c,d \
            --enable-libphobos \
            --with-libphobos-druntime-only=no \
            --disable-bootstrap \
            --disable-multilib \
            --disable-nls \
            --disable-shared \
            --disable-libatomic \
            --disable-libgomp \
            --disable-libquadmath \
            --disable-libssp \
            --disable-libvtv
          make -j"$(nproc)" all-gcc all-target-libgcc all-target-libphobos
          make install-gcc install-target-libgcc install-target-libphobos

      - name: Build current YSH D translation for NetBSD
        shell: bash
        run: |
          set -euxo pipefail
          gdc="$GITHUB_WORKSPACE/_ick-stage/bin/${NETBSD_TARGET}-gdc"
          test -x "$gdc"
          "$gdc" -v 2>&1 | tee _receipt/gdc-version.txt
          grep -F "Target: ${NETBSD_TARGET}" _receipt/gdc-version.txt

          mapfile -t library_sources < <(
            find d-source/ysh/d/source/yshd -type f -name '*.d' -print | LC_ALL=C sort
          )
          test "${#library_sources[@]}" -gt 0

          mkdir -p _/netbsd-ysh-d
          "$gdc" \
            -O2 \
            -I"$GITHUB_WORKSPACE/d-source/ysh/d/source" \
            "$GITHUB_WORKSPACE/d-source/ysh/d/source/app.d" \
            "${library_sources[@]}" \
            -o "$GITHUB_WORKSPACE/_/netbsd-ysh-d/ysh-d"

          test -s _/netbsd-ysh-d/ysh-d
          file _/netbsd-ysh-d/ysh-d
          readelf -h _/netbsd-ysh-d/ysh-d
          readelf -l _/netbsd-ysh-d/ysh-d | tee _receipt/ysh-d-program-headers.txt
          readelf -d _/netbsd-ysh-d/ysh-d | tee _receipt/ysh-d-dynamic.txt
          if grep -F "$GITHUB_WORKSPACE" _receipt/ysh-d-dynamic.txt; then
            echo 'YSH D translation contains a build-machine runtime path' >&2
            exit 1
          fi

      - name: Run current YSH D translation on NetBSD 9.3 amd64
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92
        with:
          release: "9.3"
          arch: x86_64
          sync: rsync
          run: |
            set -eu
            test "$(uname -s)" = NetBSD
            test "$(uname -m)" = amd64
            uname -a

            ysh_d="$GITHUB_WORKSPACE/_/netbsd-ysh-d/ysh-d"
            test -s "$ysh_d"
            chmod 755 "$ysh_d"
            file "$ysh_d"
            ldd "$ysh_d" || true

            actual=$("$ysh_d" '1 + 2 * 3')
            test "$actual" = 7

            "$ysh_d" -c 'var x = 1; setvar x = 42'

            program=$(cat <<'EOF'
            var items = ['a b', 'c d']; var answer = 42; write @items; write $answer $[6 * 7] @[['x', 'y']]; echo s=$answer; echo "value=$answer"; write pre$answer-post
            EOF
            )
            actual=$("$ysh_d" -c "$program")
            expected=$(printf 'a b\nc d\n42\n42\nx\ny\ns=42\nvalue=42\npre42-post\n')
            test "$actual" = "$expected"

      - name: Write D-translation receipt
        shell: bash
        run: |
          set -euxo pipefail
          {
            printf 'grease_repository_revision=%s\n' '${{ github.event.pull_request.head.sha || github.sha }}'
            printf 'grease_d_source_revision=%s\n' "$GREASE_D_REVISION"
            printf 'icky_gdc_revision=%s\n' "$ICK_REVISION"
            printf 'target=%s\n' "$NETBSD_TARGET"
            printf 'netbsd_release=%s\n' "$NETBSD_RELEASE"
            printf 'implementation=ysh-d-partial\n'
            printf 'greased_claim=no\n'
            printf 'default_pointer_changed=no\n'
            cat _receipt/netbsd-sets.txt
          } > _/netbsd-ysh-d/receipt.txt
          sha256sum _/netbsd-ysh-d/ysh-d > _/netbsd-ysh-d/ysh-d.sha256

      - name: Publish D-translation qualification artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ysh-d-netbsd-9.3-amd64-${{ github.sha }}
          path: _/netbsd-ysh-d
          if-no-files-found: error
          retention-days: 7
